<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Pi Box Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen workbench. Part rail on the left, viewport on the right, and a spec strip under the viewport. On phones it stacks: viewport, controls, rail. */
:root {
  --bg: #E6E9EC;          /* bench */
  --panel: #F5F6F7;       /* rail + strip */
  --ink: #1B2430;
  --muted: #5A6573;
  --line: #CDD3DA;
  --accent: #E39B14;      /* case-latch yellow */
  --accent-ink: #1B2430;
  --stage: #DCE1E6;       /* 3D background */
  --edge: #22303F;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161B; --panel: #191E25; --ink: #E2E7EC; --muted: #8E99A6; --line: #2A323C;
  --accent: #F0AC2B; --accent-ink: #12161B; --stage: #1A2027; --edge: #0B0F14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12161B; --panel: #191E25; --ink: #E2E7EC; --muted: #8E99A6; --line: #2A323C;
  --accent: #F0AC2B; --accent-ink: #12161B; --stage: #1A2027; --edge: #0B0F14; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.app { height: 100%; display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 0;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }

/* rail */
.rail { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; min-width: 0; }
.brand { padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: 0.02em; line-height: 1; margin: 0; text-transform: uppercase; }
.brand p { margin: 0; color: var(--muted); font-size: 12.5px; }
.group { padding: 10px 10px 4px; display: flex; flex-direction: column; gap: 2px; }
.group h2 { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 8px 4px; }
.item { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 12px minmax(0,1fr) auto; align-items: center; gap: 10px;
  padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 13.5px; }
.item:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.item[aria-current="true"] { background: var(--ink); color: var(--panel); }
.item[aria-current="true"] .dim { color: color-mix(in srgb, var(--panel) 70%, transparent); }
.sw { width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.dim { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.fit { margin: 10px 16px 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.fit h2 { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.stack { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 12px; font-size: 12.5px; }
.stack span:nth-child(even) { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.stack .hl { color: var(--accent); font-weight: 600; }

/* main */
.main { display: grid; grid-template-rows: auto minmax(0,1fr) auto; min-width: 0; min-height: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.ctl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ctl label { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12.5px; }
.ctl output { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); min-width: 3.6em; font-variant-numeric: tabular-nums; }
input[type="range"] { accent-color: var(--accent); width: 120px; }
.toggle { all: unset; box-sizing: border-box; cursor: pointer; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; color: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 5px 11px; font-size: 12.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.stage { position: relative; min-height: 0; background: var(--stage); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 11.5px; color: var(--muted); pointer-events: none; }
.status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.strip { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr); gap: 6px 28px; }
.strip h3 { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.02em; margin: 0; text-transform: uppercase; line-height: 1.1; text-wrap: balance; }
.strip p { margin: 4px 0 0; max-width: 68ch; color: var(--ink); }
.specs { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 3px 12px; font-size: 12.5px; align-content: start; }
.specs dt { color: var(--muted); font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.specs dd { margin: 0; font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto; height: auto; padding-left: 0; padding-right: 0; }
  .main { grid-template-rows: auto 62vh auto; order: 0; }
  .rail { order: 1; border-right: 0; border-top: 1px solid var(--line); }
  .bar, .strip, .brand { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .strip { grid-template-columns: 1fr; }
  input[type="range"] { width: 96px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="rail" aria-label="Parts">
    <div class="brand">
      <h1>Pi Box</h1>
      <p>Nanuk 909 · DeskPi Lite Pi5 · 10.1" screen</p>
    </div>
    <nav id="list"></nav>
    <section class="fit" aria-label="Fit check">
      <h2>Closed-case stack</h2>
      <div class="stack" id="stack"></div>
    </section>
  </aside>
  <main class="main">
    <div class="bar" id="bar">
      <div class="seg" role="group" aria-label="View">
        <button id="v-case" aria-pressed="true">In the case</button>
        <button id="v-print" aria-pressed="false">As printed</button>
      </div>
      <div class="ctl" data-case><label for="lid">Lid</label><input id="lid" type="range" min="0" max="110" value="100"><output id="lid-o">100°</output></div>
      <div class="ctl" data-case><label for="exp">Explode</label><input id="exp" type="range" min="0" max="100" value="0"><output id="exp-o">0%</output></div>
      <div class="ctl" data-case><label for="cut">Section</label><input id="cut" type="range" min="0" max="100" value="100"><output id="cut-o">off</output></div>
      <button class="toggle" id="t-comp" aria-pressed="true" data-case>Components</button>
      <button class="toggle" id="t-shell" aria-pressed="true" data-case>Case outline</button>
      <button class="toggle" id="t-edge" aria-pressed="true">Edges</button>
      <button class="toggle" id="t-reset" aria-pressed="false">Reset view</button>
    </div>
    <div class="stage" id="stage">
      <div class="status" id="status">Loading 3D viewer…</div>
      <div class="hint">Drag to orbit · right-drag or two fingers to pan · scroll or pinch to zoom · click a part to inspect it</div>
    </div>
    <div class="strip" id="strip">
      <div><h3 id="i-title"></h3><p id="i-note"></p></div>
      <dl class="specs" id="i-specs"></dl>
    </div>
  </main>
</div>

  const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
  camera.up.set(0, 0, 1);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.12;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8090a0, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-300, -500, 700); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, 0.25); fill.position.set(400, 300, 200); scene.add(fill);

  const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e4);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const edgeMats = [];
  function applyTheme() {
    scene.background = new THREE.Color(css('--stage') || '#DCE1E6');
    edgeMats.forEach((m) => m.color.set(css('--edge') || '#22303F'));
  }

  function geom(mesh) {
    const bin = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0)).buffer;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bin(mesh.p)), 3));
    g.setIndex(new THREE.BufferAttribute(mesh.i32 ? new Uint32Array(bin(mesh.i)) : new Uint16Array(bin(mesh.i)), 1));
    g.computeVertexNormals(); g.computeBoundingBox();
    return g;
  }
  function makeMesh(m, g, clipped) {
    const mat = new THREE.MeshStandardMaterial({ color: m.color, flatShading: true, metalness: 0.0, roughness: 0.75,
      side: THREE.DoubleSide, clippingPlanes: clipped ? [clip] : [], transparent: !!m.ghost, opacity: m.ghost ? 0.55 : 1 });
    const mesh = new THREE.Mesh(g, mat);
    const em = new THREE.LineBasicMaterial({ color: 0x22303f, transparent: true, opacity: 0.55, clippingPlanes: clipped ? [clip] : [] });
    edgeMats.push(em);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), em);
    mesh.add(edges); mesh.userData.edges = edges; mesh.userData.model = m;
    return mesh;
  }

  // ------------------------------------------------------------ build groups
  const caseGroup = new THREE.Group(); scene.add(caseGroup);
  const lidPivot = new THREE.Group(); lidPivot.position.set(0, HINGE_Y, HINGE_Z); caseGroup.add(lidPivot);
  const lidInner = new THREE.Group(); lidInner.position.set(0, -HINGE_Y, -HINGE_Z); lidPivot.add(lidInner);
  const printGroup = new THREE.Group(); scene.add(printGroup);
  const caseMeshes = {}, geoms = {};
  DATA.models.forEach((m) => {
    geoms[m.id] = geom(m.mesh);
    if (m.standalone) return;
    const mesh = makeMesh(m, geoms[m.id], true);
    (m.lid ? lidInner : caseGroup).add(mesh);
    caseMeshes[m.id] = mesh;
  });

  // approximate Nanuk interior outline (base tub + lid), drawn faint
  function rr(w, h, r) {
    const s = new THREE.Shape(), x0 = (C.BZ_W - w) / 2, y0 = (C.BZ_H - h) / 2;
    s.moveTo(x0 + r, y0); s.lineTo(x0 + w - r, y0); s.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
    s.lineTo(x0 + w, y0 + h - r); s.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
    s.lineTo(x0 + r, y0 + h); s.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r); s.lineTo(x0, y0 + r); s.quadraticCurveTo(x0, y0, x0 + r, y0);
    return s;
  }
  const shell = new THREE.Group();
  const shellMat = new THREE.MeshBasicMaterial({ color: 0x8a96a3, transparent: true, opacity: 0.07, depthWrite: false, side: THREE.DoubleSide, clippingPlanes: [clip] });
  const shellLine = new THREE.LineBasicMaterial({ color: 0x8a96a3, transparent: true, opacity: 0.6, clippingPlanes: [clip] });
  function tub(w, h, r, z0, z1, parent) {
    const g = new THREE.ExtrudeGeometry(rr(w, h, r), { depth: z1 - z0, bevelEnabled: false, curveSegments: 10 });
    const m = new THREE.Mesh(g, shellMat); m.position.z = z0;
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 30), shellLine)); parent.add(m); return m;
  }
  const baseShell = tub(C.BZ_W, C.BZ_H, C.BZ_R, 0, C.Z_PT, shell); caseGroup.add(shell);
  const lidShell = tub(C.LZ_W, C.LZ_H, C.LZ_R, C.Z_LP, C.Z_CEIL, new THREE.Group()); lidInner.add(lidShell);

  // print bed (256 x 256) for "As printed"
  const bed = new THREE.Group(); printGroup.add(bed);
  const bedMesh = new THREE.Mesh(new THREE.PlaneGeometry(256, 256), new THREE.MeshBasicMaterial({ color: 0x3b4450, transparent: true, opacity: 0.18, side: THREE.DoubleSide }));
  bedMesh.position.set(128, 128, -0.05); bed.add(bedMesh);
  const grid = new THREE.GridHelper(256, 16, 0x6b7785, 0x6b7785); grid.rotation.x = Math.PI / 2; grid.position.set(128, 128, 0); grid.material.transparent = true; grid.material.opacity = 0.35; bed.add(grid);
  let printMesh = null;

  // ------------------------------------------------------------ state
  const state = { view: 'case', id: null, lid: 100, exp: 0, cut: 100, comp: true, shell: true, edge: true };
  try { const s = JSON.parse(localStorage.getItem('pibox-viewer') || '{}'); Object.assign(state, s); } catch (e) {}
  const save = () => { try { localStorage.setItem('pibox-viewer', JSON.stringify(state)); } catch (e) {} };

  function printedGeometry(m) {
    const g = geoms[m.id].clone();
    if (m.flip != null) { g.scale(1, 1, -1); g.translate(0, 0, m.flip); g.index && g.setIndex(flipWinding(g.index)); g.computeVertexNormals(); }
    g.computeBoundingBox(); const b = g.boundingBox;
    g.translate(-b.min.x + (256 - (b.max.x - b.min.x)) / 2, -b.min.y + (256 - (b.max.y - b.min.y)) / 2, -b.min.z);
    g.computeBoundingBox();
    return g;
  }
  function flipWinding(index) {
    const a = index.array.slice();
    for (let i = 0; i < a.length; i += 3) { const t = a[i + 1]; a[i + 1] = a[i + 2]; a[i + 2] = t; }
    return new THREE.BufferAttribute(a, 1);
  }
  const fmt = (v) => v.toFixed(1);

  // ------------------------------------------------------------ list
  const groups = ['Lid', 'Base', 'Under the deck', 'Components', 'Undercarriage'];
  const list = $('list');
  const items = {};
  function addItem(parent, id, label, color, dimText) {
    const b = document.createElement('button'); b.className = 'item'; b.id = 'item-' + id;
    b.innerHTML = '<span class="sw"></span><span></span><span class="dim"></span>';
    b.children[0].style.background = color; b.children[1].textContent = label; b.children[2].textContent = dimText || '';
    b.addEventListener('click', () => select(id)); parent.appendChild(b); items[id] = b;
  }
  const whole = document.createElement('div'); whole.className = 'group'; list.appendChild(whole);
  addItem(whole, '__all', 'Whole build', 'linear-gradient(135deg,#5B8FD6,#9A7BC0 50%,#6FAE6F)', '');
  groups.forEach((gname) => {
    const ms = DATA.models.filter((m) => m.group === gname); if (!ms.length) return;
    const sec = document.createElement('div'); sec.className = 'group';
    const h = document.createElement('h2'); h.textContent = gname; sec.appendChild(h);
    ms.forEach((m) => {
      let dims = '';
      if (!m.ghost) { const b = printedGeometry(m).boundingBox; dims = Math.round(b.max.x - b.min.x) + '×' + Math.round(b.max.y - b.min.y); }
      addItem(sec, m.id, m.label, m.color, dims);
    });
    list.appendChild(sec);
  });

  // stack summary
  const stackRows = [
    ['Battery top', 49.5], ['Keyboard floor', 50.0], ['Keyboard top', C.KB_TOP], ['Lid frame, lowest', C.LIP],
    ['Keyboard clearance', C.LIP - C.KB_TOP, true], ['Lid ceiling', C.Z_CEIL]];
  $('stack').innerHTML = stackRows.map(([k, v, hl]) => '<span' + (hl ? ' class="hl"' : '') + '>' + k + '</span><span' + (hl ? ' class="hl"' : '') + '>' + fmt(v) + ' mm</span>').join('');

  // ------------------------------------------------------------ apply state
  function setPressed(id, on) { $(id).setAttribute('aria-pressed', on ? 'true' : 'false'); }
  function refresh() {
    const inCase = state.view === 'case';
    caseGroup.visible = inCase; printGroup.visible = !inCase;
    document.querySelectorAll('[data-case]').forEach((el) => { el.hidden = !inCase; });
    setPressed('v-case', inCase); setPressed('v-print', !inCase);
    ['comp', 'shell', 'edge'].forEach((k) => setPressed('t-' + k, state[k]));
    $('lid').value = state.lid; $('lid-o').textContent = state.lid + '°';
    $('exp').value = state.exp; $('exp-o').textContent = state.exp + '%';
    $('cut').value = state.cut; $('cut-o').textContent = state.cut >= 100 ? 'off' : 'Y ' + Math.round(state.cut / 100 * C.BZ_H);
    lidPivot.rotation.x = -state.lid * Math.PI / 180;
    clip.constant = state.cut >= 100 ? 1e4 : state.cut / 100 * C.BZ_H;
    shell.visible = lidShell.visible = state.shell;
    const focus = state.id && state.id !== '__all' ? state.id : null;
    Object.values(caseMeshes).forEach((mesh) => {
      const m = mesh.userData.model;
      mesh.position.z = (state.exp / 100) * m.explode;
      mesh.visible = !m.ghost || state.comp || m.id === focus;
      const dim = focus && m.id !== focus;
      mesh.material.transparent = dim || !!m.ghost;
      mesh.material.opacity = dim ? 0.12 : (m.ghost ? 0.55 : 1);
      mesh.material.depthWrite = !dim;
      mesh.userData.edges.visible = state.edge && !dim;
    });
    if (printMesh) printMesh.userData.edges.visible = state.edge;
    Object.entries(items).forEach(([id, el]) => el.setAttribute('aria-current', id === (state.id || '__all') ? 'true' : 'false'));
    $('v-print').disabled = !focus || DATA.models.find((m) => m.id === focus).ghost;
    $('v-print').style.opacity = $('v-print').disabled ? 0.45 : 1;
    showInfo(focus);
    save();
  }

  function showInfo(id) {
    const m = id && DATA.models.find((x) => x.id === id);
    const specs = [];
    if (!m) {
      $('i-title').textContent = 'Whole build';
      $('i-note').textContent = 'Six printed parts turn a Nanuk 909 into a Pi 5 laptop. The screen sits in the lid; the keyboard sits in a pocket on the deck, with the Pi and the Anker 737 underneath and cables running along the hinge side. Pick a part to inspect it or see it on the print bed.';
      specs.push(['Parts', '6 printed, all ≤ 256 × 256 mm'], ['Screws', '24 × #6 × ½" flat head, 18 × M3 × 10, 2 × M3 × 16 + nuts'], ['Files', 'parts/*.stl and *.3mf'], ['Fit', 'No overlaps at listing sizes']);
    } else {
      $('i-title').textContent = m.label; $('i-note').textContent = m.note;
      if (!m.ghost) {
        const b = printedGeometry(m).boundingBox;
        specs.push(['Bed size', fmt(b.max.x - b.min.x) + ' × ' + fmt(b.max.y - b.min.y) + ' × ' + fmt(b.max.z - b.min.z) + ' mm']);
        if (m.bed) specs.push(['On the bed', m.bed]);
        if (m.supports) specs.push(['Supports', m.supports]);
        if (m.file) specs.push(['File', m.file]);
      } else specs.push(['Type', 'Stand-in for fit checks, not printed']);
    }
    $('i-specs').innerHTML = specs.map(([k, v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('');
  }

  function frame(obj, dir) {
    const box = new THREE.Box3().setFromObject(obj); if (box.isEmpty()) return;
    const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
    const d = dir || new THREE.Vector3(-0.85, -1.25, 0.95);
    camera.position.copy(c).add(d.clone().normalize().multiplyScalar(size * 1.35));
    controls.target.copy(c); camera.near = size / 100; camera.far = size * 20; camera.updateProjectionMatrix(); controls.update();
  }

  function showPrinted(id) {
    if (printMesh) { printGroup.remove(printMesh); printMesh.geometry.dispose(); printMesh = null; }
    const m = DATA.models.find((x) => x.id === id); if (!m || m.ghost) return;
    printMesh = makeMesh(Object.assign({}, m, { ghost: false }), printedGeometry(m), false);
    printMesh.userData.edges.material.color.set(css('--edge') || '#22303F');
    printGroup.add(printMesh);
  }

  function select(id) {
    state.id = id;
    const m = DATA.models.find((x) => x.id === id);
    if (m && m.standalone) { state.view = 'print'; }
    else if (!m) { state.view = 'case'; }
    if (state.view === 'print') { showPrinted(id); refresh(); frame(printGroup, new THREE.Vector3(-0.9, -1.3, 1.1)); }
    else { refresh(); frame(caseGroup); }
  }

  // ------------------------------------------------------------ events
  $('v-case').addEventListener('click', () => { const m = DATA.models.find((x) => x.id === state.id); if (m && m.standalone) state.id = null; state.view = 'case'; refresh(); frame(caseGroup); });
  $('v-print').addEventListener('click', () => { if ($('v-print').disabled) return; state.view = 'print'; showPrinted(state.id); refresh(); frame(printGroup, new THREE.Vector3(-0.9, -1.3, 1.1)); });
  [['lid', 'lid'], ['exp', 'exp'], ['cut', 'cut']].forEach(([el, k]) => $(el).addEventListener('input', (e) => { state[k] = +e.target.value; refresh(); }));
  ['comp', 'shell', 'edge'].forEach((k) => $('t-' + k).addEventListener('click', () => { state[k] = !state[k]; refresh(); }));
  $('t-reset').addEventListener('click', () => frame(state.view === 'case' ? caseGroup : printGroup));

  // click a part in the 3D view
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
  renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4 || state.view !== 'case') return;
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(Object.values(caseMeshes).filter((m) => m.visible), false)
      .filter((h) => clip.distanceToPoint(h.point) >= 0 && h.object.material.opacity > 0.2);
    state.id = hits.length ? hits[0].object.userData.model.id : null; refresh();
  });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  applyTheme(); resize();
  $('status').hidden = true;
  if (state.view === 'print' && state.id) { showPrinted(state.id); refresh(); frame(printGroup, new THREE.Vector3(-0.9, -1.3, 1.1)); }
  else { state.view = 'case'; refresh(); frame(caseGroup); }
  (function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
})();
</script>
